<!--
  Countdown · Basics (Figma 8206:242). Destino: HTML estático.
  Fecha objetivo en data-countdown-target y en el datetime del <time> (ISO 8601 con zona).
  Texto al llegar a 0, opcional: data-countdown-done-text. Los números son los del wireframe:
  countdown.js los recalcula cada segundo.
-->
<div class="countdown" data-countdown-target="2026-12-20T23:59:59+01:00">
  <p class="countdown__label mb-0" aria-hidden="true" data-countdown-label>Quedan</p>
  <time
    class="countdown__box"
    datetime="2026-12-20T23:59:59+01:00"
    aria-hidden="true"
    data-countdown-box
  >
    <span class="countdown__unit">
      <span class="countdown__value" data-countdown-value="days">9</span>
      <span class="countdown__name" data-countdown-name="days">días</span>
    </span>
    <span class="countdown__unit">
      <span class="countdown__value" data-countdown-value="hours">10</span>
      <span class="countdown__name" data-countdown-name="hours">horas</span>
    </span>
    <span class="countdown__unit">
      <span class="countdown__value" data-countdown-value="minutes">25</span>
      <span class="countdown__name" data-countdown-name="minutes">minutos</span>
    </span>
    <span class="countdown__unit">
      <span class="countdown__value" data-countdown-value="seconds">27</span>
      <span class="countdown__name" data-countdown-name="seconds">segundos</span>
    </span>
  </time>
  <p class="sr-only" aria-live="polite" aria-atomic="true" data-countdown-live>
    Quedan 9 días, 10 horas y 25 minutos
  </p>
</div>
