<section class="qr-access" aria-labelledby="qr-access-title">
  <div class="qr-access__inner d-flex flex-wrap justify-content-center align-items-center">
    <div class="qr-access__content">
      <h2 id="qr-access-title" class="qr-access__title mb-3">
        ¿Ya tienes tu QR? Escanea y participa
      </h2>
      <p class="qr-access__text mb-3">
        Si ya tienes la app descargada y sesión iniciada, escanea el QR y juega sin tener que
        introducir los 15 digitos.<br />Tienes hasta X día para participar.
      </p>
      <div class="qr-access__ctas d-flex flex-wrap">
        <a class="btn btn-primary qr-access__cta" href="#">Escanear QR</a>
        <a class="btn btn-outline-secondary qr-access__cta" href="#">Acceso al juego</a>
      </div>
    </div>
    <img
      class="qr-access__image rounded"
      src="/images/roscon-king/placeholder.png"
      alt=""
      width="377"
      height="227"
      loading="lazy"
    />
  </div>
</section>
